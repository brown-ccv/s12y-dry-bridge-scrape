services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: dry_bridge_db
      POSTGRES_USER: sustainability_application
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
  app:
    image: ghcr.io/brown-ccv/s12y-dry-bridge-scrape:main
    build: .
    env_file: .env
