[project]
name = "s12y-dry-bridge-scrape"
version = "0.1.0"
description = "ETL for dry bridge solar data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "httpx-retries>=0.4.3",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.1",
    "typer>=0.19.2",
    "typing-extensions==4.12.2",
]

[dependency-groups]
dev = [
    "deptry>=0.23.1",
    "mypy>=1.18.2",
    "pytest==8.3.2",
    "ruff>=0.14.0",
    "types-psycopg2>=2.9.21.20251012",
]

[project.scripts]
dry-bridge = "dry_bridge.__main__:main"

[tool.uv]
package = true
