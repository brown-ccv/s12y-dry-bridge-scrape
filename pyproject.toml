    "charset-normalizer==3.3.2",
    "greenlet==3.0.3",
    "idna==3.7",
    "iniconfig==2.0.0",
    "packaging==24.1",
    "pandas==2.2.1",
    "playwright==1.45.1",
    "pluggy==1.5.0",
    "psycopg2-binary==2.9.9",
    "pyee==11.1.0",
    "python-dotenv==1.0.1",
    "python-slugify==8.0.4",
    "requests==2.32.3",
    "sqlalchemy==2.0.28",
    "text-unidecode==1.3",
    "typing-extensions==4.12.2",
    "urllib3==2.2.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.2",
    "pytest-base-url==2.1.0",
    "pytest-playwright==0.5.1",
    "ruff>=0.14.0",
]
